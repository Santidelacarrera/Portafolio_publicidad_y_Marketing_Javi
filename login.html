<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acceso — Javiera Gurruchaga</title><link rel="stylesheet" href="css/styles.css"></head><body class="auth-page"><main class="auth-card"><a class="wordmark" href="index.html">Javiera<br>Gurruchaga</a><h1>Acceso privado</h1><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><p id="login-error" class="form-status" role="alert"></p><button type="submit">Ingresar</button></form><a href="index.html">Volver al portafolio</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabaseClient.js"></script><script src="js/auth.js"></script><script>document.getElementById('login-form').addEventListener('submit',async(e)=>{e.preventDefault();const s=document.getElementById('login-error');s.textContent='';try{await loginWithEmail(document.getElementById('email').value,document.getElementById('password').value);location.replace('admin.html')}catch{s.textContent='No fue posible iniciar sesión. Revisa tus datos.'}});getCurrentSession().then(s=>{if(s)location.replace('admin.html')});</script></body></html>
