<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin · Portafolio Javiera Gurruchaga</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { DEFAULT: "#D63384", light: "#E85D88", dark: "#A32763" }, surface: "#F8F9FA", ink: "#1A1A1A" }, fontFamily: { display: ["Poppins","sans-serif"], body: ["Inter","sans-serif"] } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-surface text-ink font-body">

  <!-- ============ HEADER ============ -->
  <header class="bg-white border-b border-pink-100 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="font-display font-extrabold text-lg text-brand">Panel Admin</h1>
      <div class="flex items-center gap-4">
        <span id="current-user" class="text-sm text-gray-500"></span>
        <a href="index.html" class="text-sm text-gray-500 hover:text-brand">Ver portafolio</a>
        <button id="logout-btn" class="text-sm font-medium text-white bg-brand hover:bg-brand-dark px-4 py-1.5 rounded-full">
          Salir
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">

    <!-- ============ TABS ============ -->
    <div class="flex gap-2 mb-8 border-b border-gray-200">
      <button class="tab-btn active-tab" data-tab="tab-projects">Proyectos</button>
      <button class="tab-btn" data-tab="tab-stats">Estadísticas</button>
      <button class="tab-btn" data-tab="tab-settings">Contacto</button>
    </div>

    <!-- ============ TAB: PROYECTOS ============ -->
    <section id="tab-projects" class="tab-panel">
      <div class="flex items-center justify-between mb-6">
        <h2 class="font-display font-bold text-xl">Gestor de Proyectos</h2>
        <button id="new-project-btn" class="bg-brand hover:bg-brand-dark text-white text-sm font-semibold px-4 py-2 rounded-full">
          + Nuevo proyecto
        </button>
      </div>

      <div id="admin-projects-list" class="grid sm:grid-cols-2 gap-4"></div>
    </section>

    <!-- ============ TAB: ESTADÍSTICAS ============ -->
    <section id="tab-stats" class="tab-panel hidden">
      <h2 class="font-display font-bold text-xl mb-6">Estadísticas del sitio</h2>
      <div class="grid sm:grid-cols-3 gap-4 mb-8">
        <div class="bg-white rounded-2xl border border-pink-50 p-5">
          <p class="text-sm text-gray-500">Visitas totales</p>
          <p id="stat-visits" class="text-3xl font-display font-extrabold text-brand mt-1">–</p>
        </div>
        <div class="bg-white rounded-2xl border border-pink-50 p-5">
          <p class="text-sm text-gray-500">Tiempo promedio en el sitio</p>
          <p id="stat-avg-time" class="text-3xl font-display font-extrabold text-brand mt-1">–</p>
        </div>
        <div class="bg-white rounded-2xl border border-pink-50 p-5">
          <p class="text-sm text-gray-500">Proyectos publicados</p>
          <p id="stat-projects-count" class="text-3xl font-display font-extrabold text-brand mt-1">–</p>
        </div>
      </div>

      <h3 class="font-display font-bold text-lg mb-3">Vistas por proyecto</h3>
      <div id="stat-project-views" class="bg-white rounded-2xl border border-pink-50 divide-y divide-gray-100"></div>
    </section>

    <!-- ============ TAB: CONTACTO ============ -->
    <section id="tab-settings" class="tab-panel hidden">
      <h2 class="font-display font-bold text-xl mb-6">Configuración de contacto</h2>
      <form id="settings-form" class="bg-white rounded-2xl border border-pink-50 p-6 max-w-lg space-y-4">
        <div>
          <label class="text-sm font-medium text-gray-700">Enlace de Instagram</label>
          <input id="settings-instagram" type="url" required
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-light" />
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700">Correo de contacto</label>
          <input id="settings-email" type="email" required
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-light" />
        </div>
        <p id="settings-msg" class="hidden text-sm text-green-600">Guardado correctamente.</p>
        <button type="submit" class="bg-brand hover:bg-brand-dark text-white font-semibold rounded-lg px-5 py-2.5">
          Guardar cambios
        </button>
      </form>
    </section>
  </main>

  <!-- ============ MODAL: CREAR/EDITAR PROYECTO ============ -->
  <div id="project-form-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60" id="project-form-backdrop"></div>
    <div class="relative bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 sm:p-8">
      <button id="project-form-close" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-lg">&times;</button>
      <h3 id="project-form-title" class="font-display font-bold text-xl mb-5">Nuevo proyecto</h3>

      <form id="project-form" class="space-y-4">
        <input type="hidden" id="project-id" />

        <div>
          <label class="text-sm font-medium text-gray-700">Título</label>
          <input id="project-title" type="text" required
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-light" />
        </div>

        <div>
          <label class="text-sm font-medium text-gray-700">Descripción</label>
          <textarea id="project-description" rows="4" required
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-light"></textarea>
        </div>

        <div>
          <label class="text-sm font-medium text-gray-700">Categoría</label>
          <input id="project-category" type="text" placeholder="Ej: Branding, Audiovisual, Redes..."
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-light" />
        </div>

        <div>
          <label class="text-sm font-medium text-gray-700">Imágenes</label>
          <input id="project-images-file" type="file" accept="image/*" multiple
            class="mt-1 w-full text-sm" />
          <p class="text-xs text-gray-400 mt-1">Se suben automáticamente a Supabase Storage.</p>
        </div>

        <div>
          <label class="text-sm font-medium text-gray-700">Videos (archivo)</label>
          <input id="project-videos-file" type="file" accept="video/*" multiple
            class="mt-1 w-full text-sm" />
        </div>

        <div>
          <label class="text-sm font-medium text-gray-700">Videos embebidos (YouTube / Canva)</label>
          <input id="project-videos-embed" type="text" placeholder="Un enlace por línea (Enter para separar)"
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-light" />
        </div>

        <div>
          <label class="text-sm font-medium text-gray-700">Audios</label>
          <input id="project-audios-file" type="file" accept="audio/*" multiple
            class="mt-1 w-full text-sm" />
        </div>

        <div>
          <label class="text-sm font-medium text-gray-700">Enlaces adicionales</label>
          <input id="project-links" type="text" placeholder="https://... (separados por coma)"
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-light" />
        </div>

        <p id="project-form-error" class="hidden text-sm text-red-600"></p>
        <p id="project-form-progress" class="hidden text-sm text-gray-500"></p>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="project-form-cancel" class="px-4 py-2 text-sm text-gray-500 hover:text-ink">Cancelar</button>
          <button type="submit" id="project-form-submit"
            class="bg-brand hover:bg-brand-dark text-white font-semibold px-5 py-2.5 rounded-lg text-sm">
            Guardar proyecto
          </button>
        </div>
      </form>
    </div>
  </div>

  <style>
    .tab-btn {
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7280;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active-tab {
      color: #D63384;
      border-color: #D63384;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
